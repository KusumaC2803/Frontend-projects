<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Chirp — Real-Time Social Feed"
  >

  <title>Chirp — Real-Time Social Feed</title>

  <!-- =========================================================
       STYLES
       ========================================================= -->

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/blocks/layout.css">
  <link rel="stylesheet" href="css/blocks/brand.css">
  <link rel="stylesheet" href="css/blocks/sidebar-menu.css">
  <link rel="stylesheet" href="css/blocks/trends-for-you.css">
  <link rel="stylesheet" href="css/blocks/tweet.css">
  <link rel="stylesheet" href="css/blocks/who-to-follow.css">
  <link rel="stylesheet" href="css/app.css">

</head>

<body>

  <div class="app-shell">

    <!-- =======================================================
         TOP BAR
         ======================================================= -->

    <header class="topbar">

      <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="Open sidebar"
        aria-expanded="false"
      >
        ☰
      </button>

      <img
        src="svg/twitter.svg"
        class="mobile-logo"
        alt="Chirp Logo"
      >

      <strong>Home</strong>

      <button
        class="logout-btn"
        id="logoutBtn"
        type="button"
      >
        Logout
      </button>

    </header>


    <!-- =======================================================
         SIDEBAR OVERLAY
         ======================================================= -->

    <div
      class="sidebar-overlay hidden"
      id="sidebarOverlay"
      aria-hidden="true"
    ></div>


    <!-- =======================================================
         MAIN LAYOUT
         ======================================================= -->

    <div class="layout">


      <!-- =====================================================
           LEFT SIDEBAR
           ===================================================== -->

      <aside class="layout__left-sidebar">

        <img
          src="svg/twitter.svg"
          class="brand"
          alt="Chirp Logo"
        >

        <nav
          class="sidebar-menu"
          aria-label="Main navigation"
        >

          <!-- Home -->
          <a
            href="index.html"
            class="sidebar-menu__item sidebar-menu__item--active"
          >
            <img
              src="svg/home.svg"
              class="sidebar-menu__item-icon"
              alt=""
            >
            <span>Home</span>
          </a>


          <!-- Explore -->
          <a
            href="explore.html"
            class="sidebar-menu__item"
          >
            <img
              src="svg/explore.svg"
              class="sidebar-menu__item-icon"
              alt=""
            >
            <span>Explore</span>
          </a>


          <!-- Notifications -->
          <a
            href="notifications.html"
            class="sidebar-menu__item"
          >
            <img
              src="svg/notifications.svg"
              class="sidebar-menu__item-icon"
              alt=""
            >
            <span>Notifications</span>
          </a>


          <!-- Messages -->
          <a
            href="messages.html"
            class="sidebar-menu__item"
          >
            <img
              src="svg/messages.svg"
              class="sidebar-menu__item-icon"
              alt=""
            >
            <span>Messages</span>
          </a>


          <!-- Profile -->
          <a
            href="profile.html"
            class="sidebar-menu__item"
          >
            <img
              src="svg/profile.svg"
              class="sidebar-menu__item-icon"
              alt=""
            >
            <span>Profile</span>
          </a>


          <!-- More -->
          <a
            href="more.html"
            class="sidebar-menu__item"
          >
            <img
              src="svg/more.svg"
              class="sidebar-menu__item-icon"
              alt=""
            >
            <span>More</span>
          </a>

        </nav>

      </aside>


      <!-- =====================================================
           MAIN CONTENT
           ===================================================== -->

      <main class="layout__main">


        <!-- ===================================================
             PROFILE CARD
             =================================================== -->

        <section class="profile-card">

          <div class="profile-cover"></div>

          <div class="profile-row">

            <img
              id="currentUserAvatar"
              src="images/profile-image-1.jpg"
              alt="Your profile"
            >

            <button
              class="secondary-btn"
              type="button"
            >
              Edit profile
            </button>

          </div>

          <h2
            id="currentUserName"
            style="margin: 8px 0 0;"
          >
            Loading...
          </h2>

          <div
            class="muted"
            id="currentUserHandle"
          >
            @loading
          </div>

        </section>


        <!-- ===================================================
             CREATE POST
             =================================================== -->

        <section class="compose">

          <form id="postForm">

            <div class="compose-row">

              <!-- Avatar -->
              <img
                class="compose-avatar"
                id="composeAvatar"
                src="images/profile-image-1.jpg"
                alt="Your profile"
              >

              <div class="compose-main">

                <!-- Text -->
                <textarea
                  id="postContent"
                  maxlength="280"
                  placeholder="What is happening?!"
                  aria-label="Create a post"
                ></textarea>


                <!-- Image Preview -->
                <div
                  id="imagePreview"
                  class="preview hidden"
                >

                  <img
                    id="previewImg"
                    alt="Selected image preview"
                  >

                  <button
                    type="button"
                    class="remove-preview"
                    id="removePreview"
                    aria-label="Remove selected image"
                  >
                    ×
                  </button>

                </div>


                <!-- Composer Footer -->
                <div class="compose-footer">

                  <label
                    class="media-label"
                    for="postImage"
                  >
                    📷 Add image

                    <input
                      id="postImage"
                      type="file"
                      accept="image/*"
                    >
                  </label>


                  <button
                    class="primary-btn"
                    type="submit"
                  >
                    Post
                  </button>

                </div>

              </div>

            </div>

          </form>

        </section>


        <!-- ===================================================
             FEED
             =================================================== -->

        <section
          id="feed"
          aria-live="polite"
          aria-label="Chirp feed"
        >

          <!-- Skeleton Loader -->
          <div class="skeleton">

            <div class="skeleton-line medium"></div>

            <div class="skeleton-line"></div>

            <div class="skeleton-line short"></div>

          </div>

          <div class="skeleton">

            <div class="skeleton-line medium"></div>

            <div class="skeleton-line"></div>

          </div>

        </section>

      </main>


      <!-- =====================================================
           RIGHT SIDEBAR
           ===================================================== -->

      <aside class="layout__right-sidebar-container">

        <div class="layout__right-sidebar">


          <!-- =================================================
               TRENDS
               ================================================= -->

          <div class="trends-for-you">

            <div class="trends-for-you__block">

              <div class="trends-for-you__heading">
                Trends for you
              </div>

            </div>


            <!-- AI -->
            <div class="trends-for-you__block">

              <div class="trends-for-you__meta-information">
                Trending in India
              </div>

              <div class="trends-for-you__trend-name">
                #AI
              </div>

              <div class="trends-for-you__meta-information">
                155k Posts
              </div>

            </div>


            <!-- Web Development -->
            <div class="trends-for-you__block">

              <div class="trends-for-you__meta-information">
                Technology · Trending
              </div>

              <div class="trends-for-you__trend-name">
                #WebDevelopment
              </div>

            </div>


            <!-- Open Source -->
            <div class="trends-for-you__block">

              <div class="trends-for-you__meta-information">
                Trending
              </div>

              <div class="trends-for-you__trend-name">
                #OpenSource
              </div>

              <div class="trends-for-you__meta-information">
                2,800 Posts
              </div>

            </div>

          </div>


          <!-- =================================================
               WHO TO FOLLOW
               ================================================= -->

          <div class="who-to-follow">

            <div class="who-to-follow__block">

              <div class="who-to-follow__heading">
                Who to follow
              </div>

            </div>


            <!-- Person 1 -->
            <div class="who-to-follow__block">

              <img
                class="who-to-follow__author-logo"
                src="images/profile-image-1.jpg"
                alt="Becki and Chris"
              >

              <div class="who-to-follow__content">

                <div>

                  <div class="who-to-follow__author-name">
                    Becki (& Chris)
                  </div>

                  <div class="who-to-follow__author-slug">
                    @beckiandchris
                  </div>

                </div>

                <button
                  class="who-to-follow__button"
                  type="button"
                >
                  Follow
                </button>

              </div>

            </div>


            <!-- Person 2 -->
            <div class="who-to-follow__block">

              <img
                class="who-to-follow__author-logo"
                src="images/profile-image-2.png"
                alt="Elixir Digest"
              >

              <div class="who-to-follow__content">

                <div>

                  <div class="who-to-follow__author-name">
                    Elixir Digest
                  </div>

                  <div class="who-to-follow__author-slug">
                    @elixirdigest
                  </div>

                </div>

                <button
                  class="who-to-follow__button"
                  type="button"
                >
                  Follow
                </button>

              </div>

            </div>


            <!-- Person 3 -->
            <div class="who-to-follow__block">

              <img
                class="who-to-follow__author-logo"
                src="images/profile-image-3.jpg"
                alt="Chris Martin"
              >

              <div class="who-to-follow__content">

                <div>

                  <div class="who-to-follow__author-name">
                    Chris Martin
                  </div>

                  <div class="who-to-follow__author-slug">
                    @chris_martin
                  </div>

                </div>

                <button
                  class="who-to-follow__button"
                  type="button"
                >
                  Follow
                </button>

              </div>

            </div>

          </div>

        </div>

      </aside>

    </div>


    <!-- =======================================================
         TOAST
         ======================================================= -->

    <div
      id="toast"
      class="toast hidden"
      role="status"
      aria-live="polite"
    ></div>

  </div>


  <!-- =========================================================
       SUPABASE
       IMPORTANT: LOAD IN THIS EXACT ORDER
       ========================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase.js"></script>

  <script src="js/app.js"></script>

</body>

</html>
