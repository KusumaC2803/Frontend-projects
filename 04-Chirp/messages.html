<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chirp — Messages</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/app.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #14171a;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ================================
       TOP BAR
    ================================= */

    .messages-topbar {
      height: 60px;
      border-bottom: 1px solid #e1e8ed;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
    }

    .messages-brand {
      font-size: 25px;
      font-weight: 800;
    }

    .messages-page-title {
      font-size: 17px;
      font-weight: 700;
    }

    .logout-button {
      border: 1px solid #ccd6dd;
      background: #fff;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .logout-button:hover {
      background: #f5f8fa;
    }

    /* ================================
       MAIN LAYOUT
    ================================= */

    .messages-layout {
      display: grid;
      grid-template-columns: 220px minmax(300px, 360px) minmax(400px, 1fr);
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* ================================
       LEFT NAV
    ================================= */

    .messages-sidebar {
      border-right: 1px solid #e1e8ed;
      padding: 20px 10px;
      background: #fff;
    }

    .chirp-logo {
      width: 34px;
      height: 34px;
      margin: 0 0 22px 12px;
      object-fit: contain;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 13px 12px;
      margin-bottom: 5px;
      border-radius: 999px;
      color: #14171a;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
    }

    .nav-link:hover {
      background: #f5f8fa;
    }

    .nav-link.active {
      color: #1d9bf0;
      background: #e8f5fd;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    /* ================================
       CONVERSATION LIST
    ================================= */

    .conversation-panel {
      border-right: 1px solid #e1e8ed;
      overflow-y: auto;
      background: #fff;
    }

    .conversation-title {
      padding: 20px;
      font-size: 22px;
      font-weight: 800;
      border-bottom: 1px solid #e1e8ed;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 5;
    }

    .conversation {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      min-height: 76px;
      border-bottom: 1px solid #eef1f3;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .conversation:hover {
      background: #f5f8fa;
    }

    .conversation.active {
      background: #e8f5fd;
    }

    .conversation-avatar {
      width: 50px;
      height: 50px;
      min-width: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #e1e8ed;
    }

    .conversation-details {
      min-width: 0;
      flex: 1;
    }

    .conversation-name-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .conversation-name {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-handle {
      color: #657786;
      font-size: 13px;
      margin-top: 3px;
    }

    .conversation-preview {
      color: #657786;
      font-size: 13px;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-badge {
      background: #1d9bf0;
      color: white;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
    }

    .loading-users,
    .empty-users {
      padding: 40px 20px;
      text-align: center;
      color: #657786;
      line-height: 1.5;
    }

    /* ================================
       CHAT
    ================================= */

    .chat-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #fff;
      overflow: hidden;
    }

    .chat-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #657786;
      padding: 30px;
    }

    .chat-placeholder h2 {
      color: #14171a;
      margin: 0 0 10px;
      font-size: 25px;
    }

    .chat-placeholder p {
      margin: 0;
      line-height: 1.5;
    }

    .chat-content {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    .chat-header {
      min-height: 72px;
      border-bottom: 1px solid #e1e8ed;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      flex-shrink: 0;
      background: #fff;
    }

    .back-button {
      border: none;
      background: none;
      font-size: 25px;
      cursor: pointer;
      display: none;
      padding: 5px;
    }

    .chat-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #e1e8ed;
    }

    .chat-user-name {
      font-weight: 800;
      font-size: 16px;
    }

    .chat-user-handle {
      color: #657786;
      font-size: 13px;
      margin-top: 3px;
    }

    /* ================================
       CHAT MESSAGES
    ================================= */

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-container {
      max-width: 72%;
    }

    .message-bubble {
      padding: 10px 15px;
      border-radius: 18px;
      background: #eef1f3;
      color: #14171a;
      font-size: 15px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-row:not(.mine) .message-bubble {
      border-bottom-left-radius: 5px;
    }

    .message-row.mine .message-bubble {
      background: #1d9bf0;
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .message-time {
      color: #657786;
      font-size: 10px;
      margin-top: 4px;
      padding: 0 7px;
    }

    .message-row.mine .message-time {
      text-align: right;
    }

    .empty-chat {
      margin: auto;
      text-align: center;
      color: #657786;
      padding: 30px;
    }

    .empty-chat strong {
      color: #14171a;
      font-size: 16px;
    }

    /* ================================
       MESSAGE FORM
    ================================= */

    .message-form {
      border-top: 1px solid #e1e8ed;
      padding: 13px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #fff;
      flex-shrink: 0;
    }

    .message-input {
      flex: 1;
      min-height: 44px;
      max-height: 130px;
      resize: none;
      border: 1px solid #ccd6dd;
      border-radius: 22px;
      padding: 11px 16px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .message-input:focus {
      border-color: #1d9bf0;
      box-shadow: 0 0 0 1px #1d9bf0;
    }

    .send-button {
      border: none;
      background: #1d9bf0;
      color: white;
      border-radius: 999px;
      padding: 11px 19px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      min-width: 65px;
    }

    .send-button:hover {
      background: #1689d7;
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* ================================
       TOAST
    ================================= */

    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #14171a;
      color: white;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 14px;
      display: none;
      z-index: 100;
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 900px) {

      .messages-layout {
        grid-template-columns: 70px minmax(280px, 1fr);
      }

      .messages-sidebar {
        padding: 15px 8px;
      }

      .chirp-logo {
        margin-left: 10px;
      }

      .nav-link {
        justify-content: center;
        padding: 13px 8px;
      }

      .nav-link span {
        display: none;
      }

      .chat-panel {
        display: none;
      }

      .conversation-panel.mobile-hidden {
        display: none;
      }

      .chat-panel.mobile-visible {
        display: flex;
      }

      .back-button {
        display: block;
      }
    }

    @media (max-width: 600px) {

      .messages-layout {
        grid-template-columns: 1fr;
      }

      .messages-sidebar {
        display: none;
      }

      .conversation-panel {
        width: 100%;
      }

      .chat-panel {
        width: 100%;
      }

      .message-container {
        max-width: 82%;
      }

      .messages-topbar {
        padding: 0 12px;
      }

      .messages-brand {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================
       TOP BAR
  ========================================== -->

  <header class="messages-topbar">

    <div class="messages-brand">
      🐦 Chirp
    </div>

    <div class="messages-page-title">
      Messages
    </div>

    <button
      id="logoutBtn"

      type="button"

      Logout
    </button>

  </header>


  <!-- =========================================
       MAIN
  ========================================== -->

  <div class="messages-layout">

    <!-- =======================================
         SIDEBAR
    ======================================== -->

    <aside class="messages-sidebar">

      <img
        src="svg/twitter.svg"
        class="chirp-logo"
        alt="Chirp"
      >

      <nav>

        <a
          href="index.html"

        >
          <img
            src="svg/home.svg"
            class="nav-icon"
            alt=""
          >
          <span>Home</span>
        </a>


        <a
          href="explore.html"
          class="nav-link"
        >
          <img
            src="svg/explore.svg"
            class="nav-icon"
            alt=""
          >
          <span>Explore</span>
        </a>


        <a
          href="notifications.html"
          class="nav-link"
        >
          <img
            src="svg/notifications.svg"
            class="nav-icon"
            alt=""
          >
          <span>Notifications</span>
        </a>


        <a
          href="messages.html"
          class="nav-link active"
        >
          <img
            src="svg/messages.svg"
            class="nav-icon"
            alt=""
          >
          <span>Messages</span>
        </a>


        <a
          href="profile.html"
          class="nav-link"
        >
          <img
            src="svg/profile.svg"

          >

        <a

        >
          <img

    </aside>


    <!-- =======================================
         CONVERSATIONS
    ======================================== -->

    <section
      id="conversationPanel"
      class="conversation-panel"
    >

      <div class="conversation-title">
        Messages
      </div>

      <div id="usersList">

        <div class="loading-users">

        </div>

      </div>

    </section>


    <!-- =======================================
         CHAT
    ======================================== -->

    <section
      id="chatPanel"

    >

      <div
        id="chatPlaceholder"

      >

        <div>

          <h2>

  </div>


  <div
    id="toast"

  <!-- =========================================
       SUPABASE
  ========================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase.js"></script>


  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      async function () {

        const messageSupabase =
          window.appSupabase;


        if (!messageSupabase) {

          console.error(
            "Supabase client not available."
          );

          return;

        }


        /* =====================================
           ELEMENTS
        ====================================== */

        const usersList =
          document.getElementById(
            "usersList"
          );

        const conversationPanel =
          document.getElementById(
            "conversationPanel"
          );

        const chatPanel =
          document.getElementById(
            "chatPanel"
          );

        const chatPlaceholder =
          document.getElementById(
            "chatPlaceholder"
          );

        const chatContent =
          document.getElementById(
            "chatContent"
          );

        const chatAvatar =
          document.getElementById(
            "chatAvatar"
          );

        const chatUserName =
          document.getElementById(
            "chatUserName"
          );

        const chatUserHandle =
          document.getElementById(
            "chatUserHandle"
          );

        const chatMessages =
          document.getElementById(
            "chatMessages"
          );

        const messageForm =
          document.getElementById(
            "messageForm"
          );

        const messageInput =
          document.getElementById(
            "messageInput"
          );

        const sendButton =
          document.getElementById(
            "sendButton"
          );

        const logoutBtn =
          document.getElementById(
            "logoutBtn"
          );

        const backButton =
          document.getElementById(
            "backButton"
          );

        const toast =
          document.getElementById(
            "toast"
          );


        /* =====================================
           STATE
        ====================================== */

        let currentUser = null;

        let selectedUser = null;

        let allUsers = [];

        let realtimeChannel = null;


        const fallbackAvatar =
          "images/profile-image-1.jpg";


        /* =====================================
           TOAST
        ====================================== */

        function showToast(message) {

          toast.textContent =
            message;

          toast.style.display =
            "block";


          clearTimeout(
            showToast.timer
          );


          showToast.timer =
            setTimeout(
              function () {

                toast.style.display =
                  "none";

              },
              2500
            );

        }


        /* =====================================
           ESCAPE HTML
        ====================================== */

        function escapeHtml(value) {

          return String(
            value ?? ""
          ).replace(
            /[&<>"']/g,
            function (character) {

              return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
              }[character];

            }
          );

        }


        /* =====================================
           FORMAT TIME
        ====================================== */

        function formatMessageTime(
          timestamp
        ) {

          const date =
            new Date(timestamp);


          if (
            Number.isNaN(
              date.getTime()
            )
          ) {

            return "";

          }


          return date.toLocaleTimeString(
            [],
            {
              hour: "numeric",
              minute: "2-digit"
            }
          );

        }


        /* =====================================
           AUTH
        ====================================== */

        async function getCurrentUser() {

          const {
            data,
            error
          } =
            await messageSupabase.auth.getSession();


          if (error) {

            throw error;

          }


          currentUser =
            data?.session?.user ||
            null;


          if (!currentUser) {

            window.location.href =
              "login.html";

            return false;

          }


          return true;

        }


        /* =====================================
           LOAD ALL USERS
        ====================================== */

        async function loadUsers() {

          const {
            data,
            error
          } =
            await messageSupabase
              .from("profiles")
              .select(
                "id,name,handle,avatar_url"
              )
              .neq(
                "id",
                currentUser.id
              )
              .order(
                "name",
                {
                  ascending: true
                }
              );


          if (error) {

            throw error;

          }


          allUsers =
            data || [];


          if (
            allUsers.length === 0
          ) {

            usersList.innerHTML = `

              <div class="empty-users">

                No other users yet.

                <br><br>

                Create another account
                to start messaging.

              </div>

            `;

            return;

          }


          await renderUsers();

        }


        /* =====================================
           RENDER USERS
        ====================================== */

        async function renderUsers() {

          const userHtml = [];


          for (
            const user of allUsers
          ) {

            let unreadCount = 0;

            let latestMessage = null;


            /* Get latest message */

            const {
              data: latestData
            } =
              await messageSupabase
                .from("messages")
                .select(
                  "content,created_at"
                )
                .or(
                  `and(sender_id.eq.${currentUser.id},receiver_id.eq.${user.id}),and(sender_id.eq.${user.id},receiver_id.eq.${currentUser.id})`
                )
                .order(
                  "created_at",
                  {
                    ascending: false
                  }
                )
                .limit(1);


            if (
              latestData &&
              latestData.length
            ) {

              latestMessage =
                latestData[0];

            }


            /* Count unread messages */

            const {
              count
            } =
              await messageSupabase
                .from("messages")
                .select(
                  "id",
                  {
                    count: "exact",
                    head: true
                  }
                )
                .eq(
                  "sender_id",
                  user.id
                )
                .eq(
                  "receiver_id",
                  currentUser.id
                )
                .eq(
                  "is_read",
                  false
                );


            unreadCount =
              count || 0;


            const avatar =
              user.avatar_url ||
              fallbackAvatar;


            userHtml.push(`

              <div
                class="conversation ${
                  selectedUser &&
                  selectedUser.id === user.id
                    ? "active"
                    : ""
                }"
                data-user-id="${escapeHtml(
                  user.id
                )}"
              >

                <img
                  class="conversation-avatar"
                  src="${escapeHtml(
                    avatar
                  )}"
                  alt="${escapeHtml(
                    user.name ||
                    "User"
                  )}"
                >


                <div class="conversation-details">

                  <div class="conversation-name-row">

                    <div class="conversation-name">

                      ${escapeHtml(
                        user.name ||
                        "User"
                      )}

                    </div>

                    ${
                      unreadCount > 0
                        ? `
                          <div class="unread-badge">
                            ${
                              unreadCount > 99
                                ? "99+"
                                : unreadCount
                            }
                          </div>
                        `
                        : ""
                    }

                  </div>


                  <div class="conversation-handle">

                    @${escapeHtml(
                      String(
                        user.handle ||
                        "user"
                      ).replace(
                        /^@/,
                        ""
                      )
                    )}

                  </div>


                  ${
                    latestMessage
                      ? `
                        <div class="conversation-preview">

                          ${escapeHtml(
                            latestMessage.content
                          )}

                        </div>
                      `
                      : ""
                  }

                </div>

              </div>

            `);

          }


          usersList.innerHTML =
            userHtml.join("");


          document
            .querySelectorAll(
              ".conversation"
            )
            .forEach(
              function (conversation) {

                conversation.addEventListener(
                  "click",
                  async function () {

                    const userId =
                      conversation.dataset.userId;


                    const user =
                      allUsers.find(
                        function (item) {

                          return (
                            item.id ===
                            userId
                          );

                        }
                      );


                    if (!user) {

                      return;

                    }


                    document
                      .querySelectorAll(
                        ".conversation"
                      )
                      .forEach(
                        function (item) {

                          item.classList.remove(
                            "active"
                          );

                        }
                      );


                    conversation.classList.add(
                      "active"
                    );


                    await openConversation(
                      user
                    );

                  }
                );

              }
            );

        }


        /* =====================================
           OPEN CONVERSATION
        ====================================== */

        async function openConversation(
          user
        ) {

          selectedUser =
            user;


          chatPlaceholder.style.display =
            "none";


          chatContent.style.display =
            "flex";


          chatAvatar.src =
            user.avatar_url ||
            fallbackAvatar;


          chatUserName.textContent =
            user.name ||
            "User";


          chatUserHandle.textContent =
            "@" +
            String(
              user.handle ||
              "user"
            ).replace(
              /^@/,
              ""
            );


          await loadMessages();

          await markMessagesRead();

          await renderUsers();


          messageInput.focus();


          if (
            window.innerWidth <= 900
          ) {

            conversationPanel.classList.add(
              "mobile-hidden"
            );

            chatPanel.classList.add(
              "mobile-visible"
            );

          }

        }


        /* =====================================
           LOAD MESSAGES
        ====================================== */

        async function loadMessages() {

          if (!selectedUser) {

            return;

          }


          const {
            data,
            error
          } =
            await messageSupabase
              .from("messages")
              .select(
                "id,sender_id,receiver_id,content,is_read,created_at"
              )
              .or(
                `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`
              )
              .order(
                "created_at",
                {
                  ascending: true
                }
              );


          if (error) {

            console.error(
              "Load messages error:",
              error
            );


            chatMessages.innerHTML = `

              <div class="empty-chat">

                Unable to load messages.

              </div>

            `;

            return;

          }


          if (
            !data ||
            data.length === 0
          ) {

            chatMessages.innerHTML = `

              <div class="empty-chat">

                <strong>
                  No messages yet 👋
                </strong>

                <p>
                  Send the first message.
                </p>

              </div>

            `;

            return;

          }


          chatMessages.innerHTML =
            data.map(
              function (message) {

                const mine =
                  message.sender_id ===
                  currentUser.id;


                return `

                  <div
                    class="message-row ${
                      mine
                        ? "mine"
                        : ""
                    }"
                  >

                    <div class="message-container">

                      <div class="message-bubble">

                        ${escapeHtml(
                          message.content
                        )}

                      </div>

                      <div class="message-time">

                        ${formatMessageTime(
                          message.created_at
                        )}

                      </div>

                    </div>

                  </div>

                `;

              }
            ).join("");


          scrollToBottom();

        }


        /* =====================================
           SEND MESSAGE
        ====================================== */

        messageForm.addEventListener(
          "submit",
          async function (event) {

            event.preventDefault();


            if (!selectedUser) {

              showToast(
                "Select someone to message first."
              );

              return;

            }


            const content =
              messageInput.value.trim();


            if (!content) {

              return;

            }


            sendButton.disabled =
              true;

            sendButton.textContent =
              "Sending...";


            try {

              const {
                error
              } =
                await messageSupabase
                  .from("messages")
                  .insert({
                    sender_id:
                      currentUser.id,

                    receiver_id:
                      selectedUser.id,

                    content:
                      content
                  });


              if (error) {

                throw error;

              }


              messageInput.value =
                "";


              await loadMessages();


              await renderUsers();


            } catch (error) {

              console.error(
                "Send message error:",
                error
              );


              showToast(
                error.message ||
                "Unable to send message."
              );

            } finally {

              sendButton.disabled =
                false;

              sendButton.textContent =
                "Send";

              messageInput.focus();

            }

          }
        );


        /* =====================================
           ENTER TO SEND
        ====================================== */

        messageInput.addEventListener(
          "keydown",
          function (event) {

            if (
              event.key === "Enter" &&
              !event.shiftKey
            ) {

              event.preventDefault();

              messageForm.requestSubmit();

            }

          }
        );


        /* =====================================
           MARK AS READ
        ====================================== */

        async function markMessagesRead() {

          if (!selectedUser) {

            return;

          }


          const {
            error
          } =
            await messageSupabase
              .from("messages")
              .update({
                is_read: true
              })
              .eq(
                "sender_id",
                selectedUser.id
              )
              .eq(
                "receiver_id",
                currentUser.id
              )
              .eq(
                "is_read",
                false
              );


          if (error) {

            console.warn(
              "Mark read error:",
              error
            );

          }

        }


        /* =====================================
           REALTIME
        ====================================== */

        function setupRealtime() {

          realtimeChannel =
            messageSupabase
              .channel(
                "chirp-messages-" +
                currentUser.id
              )
              .on(
                "postgres_changes",
                {
                  event: "INSERT",
                  schema: "public",
                  table: "messages"
                },
                async function (payload) {

                  const newMessage =
                    payload.new;


                  if (
                    !newMessage
                  ) {

                    return;

                  }


                  /*
                   * If this message belongs
                   * to the currently open
                   * conversation, reload it.
                   */

                  if (
                    selectedUser &&
                    (
                      (
                        newMessage.sender_id ===
                        currentUser.id &&
                        newMessage.receiver_id ===
                        selectedUser.id
                      ) ||
                      (
                        newMessage.sender_id ===
                        selectedUser.id &&
                        newMessage.receiver_id ===
                        currentUser.id
                      )
                    )
                  ) {

                    await loadMessages();


                    /*
                     * If another user sent it
                     * while the conversation is open,
                     * immediately mark it read.
                     */

                    if (
                      newMessage.sender_id ===
                      selectedUser.id &&
                      newMessage.receiver_id ===
                      currentUser.id
                    ) {

                      await messageSupabase
                        .from("messages")
                        .update({
                          is_read: true
                        })
                        .eq(
                          "id",
                          newMessage.id
                        );

                    }

                  }


                  /*
                   * Refresh conversation
                   * previews and unread counts.
                   */

                  await renderUsers();

                }
              )
              .subscribe(
                function (status) {

                  console.log(
                    "Messages Realtime:",
                    status
                  );

                }
              );

        }


        /* =====================================
           BACK BUTTON
        ====================================== */

        backButton.addEventListener(
          "click",
          function () {

            conversationPanel.classList.remove(
              "mobile-hidden"
            );

            chatPanel.classList.remove(
              "mobile-visible"
            );


            chatContent.style.display =
              "none";


            chatPlaceholder.style.display =
              "flex";


            selectedUser =
              null;

          }
        );


        /* =====================================
           LOGOUT
        ====================================== */

        logoutBtn.addEventListener(
          "click",
          async function () {

            if (realtimeChannel) {

              await messageSupabase
                .removeChannel(
                  realtimeChannel
                );

            }


            await messageSupabase.auth.signOut();


            window.location.href =
              "login.html";

          }
        );


        /* =====================================
           AUTO RESIZE TEXTAREA
        ====================================== */

        messageInput.addEventListener(
          "input",
          function () {

            this.style.height =
              "auto";

            this.style.height =
              Math.min(
                this.scrollHeight,
                130
              ) + "px";

          }
        );


        /* =====================================
           INITIALIZE
        ====================================== */

        try {

          const loggedIn =
            await getCurrentUser();


          if (!loggedIn) {

            return;

          }


          await loadUsers();


          setupRealtime();


          console.log(
            "Chirp Messages initialized successfully."
          );


        } catch (error) {

          console.error(
            "Messages initialization error:",
            error
          );


          usersList.innerHTML = `

            <div
              class="empty-users"
              style="color:#e0245e;"
            >

              Unable to load users.

              <br><br>

              ${escapeHtml(
                error.message ||
                "Unknown error"
              )}

            </div>

          `;

        }

      }
    );

  </script>

</body>

</html>
